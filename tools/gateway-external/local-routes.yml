_format_version: '2.1'
_transform: true
services:

#
# Handles local computer requests from the console client to the autonomous agent
#
- name: autonomous-agent-card
  url: http://host.docker.internal:3000/.well-known/agent-card.json
  routes:
  - name: autonomous-agent-card
    hosts:
    - localhost
    paths:
    - /a2a/.well-known/agent-card.json

#
# Handles local computer A2A requests from the console client
#
- name: autonomous-agent
  url: http://host.docker.internal:3000
  routes:
  - name: autonomous-agent
    hosts:
    - localhost
    paths:
    - /a2a
  plugins:
  - name: request-transformer
    config:
      replace:
        uri: "/$(uri_captures[1])"
