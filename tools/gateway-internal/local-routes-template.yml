_format_version: '2.1'
_transform: true
services:

#
# Handles local computer requests from the autonomous agent to the MCP server's unsecured metadata endpoint
#
- name: portfolio-mcp-server-resource-metadata
  url: http://host.docker.internal:3001/.well-known/oauth-protected-resource
  routes:
  - name: portfolio-mcp-server-resource-metadata
    hosts:
    - localhost:81
    paths:
    - /mcp/.well-known/oauth-protected-resource

#
# Calls to the MCP server exchange the opaque access token for a JWT access token with agent attributes
#
- name: portfolio-mcp-server
  url: http://host.docker.internal:3001
  routes:
  - name: portfolio-mcp-server
    hosts:
    - localhost:81
    paths:
    - /mcp
  plugins:
  - name: request-transformer
    config:
      replace:
        uri: "/$(uri_captures[1])"
  - name: token-exchange
    config:
      token_endpoint: http://idsvr:8443/oauth/v2/oauth-token
      client_id: internal-gateway-client
      client_secret: $GATEWAY_TOKEN_EXCHANGE_SECRET
      token_cache_seconds: 900
      target_audience: 'https://mcp.demo.example'
  - name: token-audit
 